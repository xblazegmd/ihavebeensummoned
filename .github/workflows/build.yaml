name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build program (PyInstaller)
        run: |
          pyinstaller --windowed --icon=icons/IHBS_icon.icns --distpath dist/ main.py -n "I Have Been Summoned"
      
      - name: Prepare .app bundle
        run: |
          cd dist
          zip -r "ihavebeensummoned_macos.zip" "I Have Been Summoned.app"
      
      - name: Create release
        if: '!contains(github.ref_name, "-")'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          body_path: CHANGELOG.md
          files: dist/ihavebeensummoned_macos.zip

      - name: Create pre-release
        if: contains(github.ref_name, "-")
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body_path: CHANGELOG.md
          files: dist/ihavebeensummoned_macos.zip